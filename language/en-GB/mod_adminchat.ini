MOD_ADMINCHAT="Admin Chat"
MOD_ADMINCHAT_XML_DESCRIPTION="Puts a live support chat inside the Joomla administrator, so site editors can reach you without leaving the admin. Works with Tawk.to, Crisp or WhatsApp."

MOD_ADMINCHAT_FIELD_CHAT_TYPE_LABEL="Chat Service"
MOD_ADMINCHAT_FIELD_CHAT_TYPE_DESC="The chat service your support team uses."
MOD_ADMINCHAT_CHAT_TYPE_TAWKTO="Tawk.to"
MOD_ADMINCHAT_CHAT_TYPE_CRISP="Crisp"
MOD_ADMINCHAT_CHAT_TYPE_WHATSAPP="WhatsApp"

MOD_ADMINCHAT_FIELD_TAWKTO_LABEL="Tawk.to Widget"
MOD_ADMINCHAT_FIELD_TAWKTO_DESC="Your property and widget ID, e.g. 64a1b2c3d4e5f6a7b8c9d0e1/1h2j3k4l5. You can also paste the whole Tawk.to embed code; the ID is picked out of it."
MOD_ADMINCHAT_FIELD_CRISP_LABEL="Crisp Website ID"
MOD_ADMINCHAT_FIELD_CRISP_DESC="Found in Crisp under Settings > Website Settings > Setup instructions. You can also paste the whole Crisp snippet."
MOD_ADMINCHAT_FIELD_WHATSAPP_NUMBER_LABEL="WhatsApp Number"
MOD_ADMINCHAT_FIELD_WHATSAPP_NUMBER_DESC="Full international number, e.g. +44 7700 900123. Spaces and the plus sign are fine."
MOD_ADMINCHAT_FIELD_WHATSAPP_MESSAGE_LABEL="Opening Message"
MOD_ADMINCHAT_FIELD_WHATSAPP_MESSAGE_DESC="Optional. Pre-fills the first message, e.g. Hello, I need help with the website."
MOD_ADMINCHAT_FIELD_SHOW_NOTICE_LABEL="Show Notice"
MOD_ADMINCHAT_FIELD_SHOW_NOTICE_DESC="Show a short line in the module position telling editors where the chat is."

MOD_ADMINCHAT_NOTICE="Need a hand? The support chat is in the bottom right of the window."
MOD_ADMINCHAT_WHATSAPP_BUTTON="Support on WhatsApp"
MOD_ADMINCHAT_NOT_CONFIGURED="Admin Chat isn't set up yet. Open the module and add your chat details."
MOD_ADMINCHAT_MESSENGER_RETIRED="Meta retired the Messenger chat plugin in 2024. Open the module and choose another chat service."
